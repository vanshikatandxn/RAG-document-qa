<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="RAG Document QA — grounded, cited answers from your PDFs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#d98cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- Title block -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="70" y="128" font-size="58" font-weight="700" fill="#ffffff">RAG Document QA</text>
    <rect x="72" y="150" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="196" font-size="22" fill="#c7cce8">Ask questions about any PDF. Get grounded,</text>
    <text x="70" y="226" font-size="22" fill="#c7cce8">cited answers powered by Claude.</text>
    <text x="70" y="276" font-size="15" fill="#8a90b8" letter-spacing="2">PDF  ·  CHUNK  ·  TF-IDF RETRIEVE  ·  CLAUDE  ·  CITED ANSWER</text>
  </g>

  <!-- Pipeline illustration -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#c7cce8" text-anchor="middle">
    <!-- Document -->
    <g transform="translate(760,90)">
      <path d="M0 0h70l26 26v104H0z" fill="#1f2547" stroke="#7c9cff" stroke-width="2"/>
      <path d="M70 0v26h26" fill="none" stroke="#7c9cff" stroke-width="2"/>
      <rect x="14" y="40" width="64" height="5" rx="2" fill="#7c9cff" opacity=".7"/>
      <rect x="14" y="56" width="52" height="5" rx="2" fill="#7c9cff" opacity=".5"/>
      <rect x="14" y="72" width="64" height="5" rx="2" fill="#d98cff" opacity=".9"/>
      <rect x="14" y="88" width="44" height="5" rx="2" fill="#7c9cff" opacity=".5"/>
      <rect x="14" y="104" width="58" height="5" rx="2" fill="#7c9cff" opacity=".5"/>
      <text x="48" y="156">PDF</text>
    </g>

    <!-- Arrow -->
    <path d="M872 155h48" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M914 147l10 8-10 8" fill="none" stroke="#d98cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Answer bubble -->
    <g transform="translate(940,98)">
      <rect width="190" height="104" rx="16" fill="#1f2547" stroke="#d98cff" stroke-width="2"/>
      <path d="M30 104l-6 18 22-18" fill="#1f2547" stroke="#d98cff" stroke-width="2" stroke-linejoin="round"/>
      <rect x="18" y="22" width="150" height="6" rx="3" fill="#ffffff" opacity=".85"/>
      <rect x="18" y="40" width="128" height="6" rx="3" fill="#ffffff" opacity=".6"/>
      <rect x="18" y="58" width="140" height="6" rx="3" fill="#ffffff" opacity=".6"/>
      <rect x="18" y="76" width="74" height="16" rx="8" fill="url(#accent)"/>
      <text x="55" y="88" font-size="10" font-weight="700" fill="#0b1020">chunk 2</text>
      <text x="95" y="156">Cited answer</text>
    </g>
  </g>
</svg>
